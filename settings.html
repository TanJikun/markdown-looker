<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <title>设置</title>
    <link rel="stylesheet" href="/src/settings.css">
</head>

<body>
    <div class="settings-app">
        <header class="settings-titlebar">
            <span class="settings-titlebar-title">设置</span>
            <button type="button" class="settings-titlebar-close" aria-label="关闭">×</button>
        </header>

        <div class="settings-main">
            <aside class="settings-sidebar">
                <nav class="settings-nav">
                    <button type="button" class="settings-nav-item active" data-panel="appearance">外观</button>
                </nav>
            </aside>

            <main class="settings-content">
                <section class="settings-panel" data-panel="appearance">
                    <h2 class="settings-panel-title">外观</h2>

                    <div class="settings-field">
                        <div class="settings-field-label">主题</div>
                        <div class="settings-field-control">
                            <div class="theme-group">
                                <button type="button" class="theme-btn" data-theme="system">跟随系统</button>
                                <button type="button" class="theme-btn" data-theme="dark">深色</button>
                                <button type="button" class="theme-btn" data-theme="light">浅色</button>
                            </div>
                        </div>
                    </div>

                    <div class="settings-field">
                        <div class="settings-field-label">
                            设置窗口大小
                            <span class="settings-hint">相对主窗口，拖动即时生效</span>
                        </div>
                        <div class="settings-field-control">
                            <input type="range" id="ratio-input" min="40" max="100" step="5" value="80">
                            <span id="ratio-value" class="ratio-value">80%</span>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script type="module" src="/src/settings.js"></script>
</body>

</html>
