<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <title>Markdown Looker</title>
  <script type="module" crossorigin src="/assets/index-Di-nk8kO.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-CXxTSpYB.css">
</head>

<body>
  <header id="top-bar">
    <div id="menu-container">
      <button id="menu-btn">☰</button>
      <div id="dropdown-menu">
        <button id="menu-open">打开文件 <span class="shortcut">Ctrl+O</span></button>
        <button id="menu-save">保存 <span class="shortcut">Ctrl+S</span></button>
        <button id="menu-save-as">另存为 <span class="shortcut">Ctrl+Shift+S</span></button>
        <hr>
        <div class="theme-menu">
          <button id="theme-menu-btn">主题 <span class="submenu-arrow">▸</span></button>
          <div id="theme-submenu">
            <button class="theme-option" data-theme="system">跟随系统</button>
            <button class="theme-option" data-theme="dark">深色</button>
            <button class="theme-option" data-theme="light">浅色</button>
          </div>
        </div>
      </div>
    </div>
    <div id="tabs-container"></div>
  </header>

  <main id="main-content">
    <div id="editor-container" style="width: 50%; height: 100%; border-right: 1px solid var(--border);"></div>
    <div id="preview" style="flex: 1; height: 100%; overflow-y: auto; padding: 24px; background: var(--bg);">
      <div id="output"></div>
    </div>
  </main>

  <input type="file" id="fallbackInput" accept=".md,.markdown,.mdx,.txt" hidden>

</body>

</html>
