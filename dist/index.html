<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <title>Markdown Looker</title>
  <script type="module" crossorigin src="/assets/main-GpSGkIh8.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/preload-helper-CS1eXPs2.js">
  <link rel="modulepreload" crossorigin href="/assets/shiki-Df6LOx4X.js">
  <link rel="modulepreload" crossorigin href="/assets/shortcuts-D_nznk2l.js">
  <link rel="stylesheet" crossorigin href="/assets/main-DUxhgXLF.css">
</head>

<body>
  <header id="top-bar">
    <div id="menu-container">
      <button id="menu-btn">☰</button>
      <div id="dropdown-menu">
        <button id="menu-open">打开文件 <span class="shortcut" data-shortcut-for="open">Ctrl+O</span></button>
        <button id="menu-save">保存 <span class="shortcut" data-shortcut-for="save">Ctrl+S</span></button>
        <button id="menu-save-as">另存为 <span class="shortcut" data-shortcut-for="saveAs">Ctrl+Shift+S</span></button>
        <hr>
        <button id="menu-settings">设置</button>
      </div>
    </div>
    <div id="tabs-container"></div>
  </header>

  <!-- Markdown 工具栏 -->
  <div id="md-toolbar"></div>

  <main id="main-content" class="mode-split">
    <div id="editor-container"></div>
    <div id="preview">
      <div id="output"></div>
    </div>
  </main>

  <input type="file" id="fallbackInput" accept=".md,.markdown,.mdx,.txt" hidden>

</body>

</html>
